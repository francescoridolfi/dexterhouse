# DexterHouse: `cp .env.example .env && docker compose up -d` (see infra/deployment in dev docs).
name: dexterhouse

x-core: &core
  image: ${DH_IMAGE_PREFIX:-ghcr.io/francescoridolfi}/dexterhouse-core:${DH_VERSION:-0.1.0}
  build: { context: ., dockerfile: docker/Dockerfile.core }
  env_file: .env
  environment: &core-env
    SECRET_KEY_FILE: /run/dh-secrets/secret_key
    DATABASE_PASSWORD_FILE: /run/dh-secrets/pg_password
    FERNET_KEY_FILE: /run/dh-secrets/fernet_key
    RUNNER_KEY_FILE: /run/dh-secrets/runner_key
  volumes: &core-volumes
    - dh_secrets:/run/dh-secrets:ro
    - packages:/data/packages
  depends_on: &core-depends
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  networks: [internal]
  restart: unless-stopped

services:
  secrets-init:
    <<: *core
    command: ["python", "-m", "dexterhouse.tools.init_secrets", "/run/dh-secrets"]
    volumes: [dh_secrets:/run/dh-secrets]
    depends_on: {}
    networks: []
    network_mode: none
    restart: "no"

  migrate:
    <<: *core
    # Built-in agents, tools and processes go through the package installer (E-07).
    command: ["sh", "-c", "dexterhouse-manage migrate --noinput && dexterhouse-manage packages sync-builtin"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    <<: *core
    environment: { <<: *core-env, DH_SERVICE: web }
    command: >-
      uvicorn dexterhouse.asgi:application --host 0.0.0.0 --port 8000
      --workers ${WEB_WORKERS:-2} --proxy-headers --forwarded-allow-ips=* --no-access-log
    networks: [internal, public]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy: { resources: { limits: { cpus: "1.0", memory: 1g } } }

  worker:
    <<: *core
    environment: { <<: *core-env, DH_SERVICE: worker }
    command: >-
      celery -A dexterhouse worker -Q agents,default,core-callbacks
      -c ${WORKER_CONCURRENCY:-4} -l info
    volumes: [dh_secrets:/run/dh-secrets:ro, packages:/data/packages]
    # Agents call the LLM providers, the registry index and package repositories from here.
    networks: [internal, egress]
    # Ollama on the Docker host (OLLAMA_BASE_URL); Docker Desktop resolves it on its own.
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A dexterhouse inspect ping -d celery@$$HOSTNAME -t 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  beat:
    <<: *core
    environment: { <<: *core-env, DH_SERVICE: beat }
    command: >-
      celery -A dexterhouse beat -l info --pidfile /tmp/celerybeat.pid
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(int(open('/tmp/celerybeat.pid').read()), 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The only service with the Docker socket (ADR-0006): it creates the workspaces on their own
  # internal networks `dh_sandbox_<id>` and never lives on them. It holds only the runner key.
  # On `egress` because `deliver` pushes from here (never from a workspace, ADR-0016).
  runner:
    image: ${DH_IMAGE_PREFIX:-ghcr.io/francescoridolfi}/dexterhouse-runner:${DH_VERSION:-0.1.0}
    build: { context: ., dockerfile: docker/Dockerfile.runner }
    command: ["dexterhouse-runner", "worker"]
    env_file: .env
    environment:
      RUNNER_KEY_FILE: /run/dh-secrets/runner_key
      CORE_URL: http://web:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dh_secrets:/run/dh-secrets:ro
    depends_on:
      redis: { condition: service_healthy }
      proxy: { condition: service_healthy }
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "dexterhouse-runner", "health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Egress of the workspaces: Squid with the WORKSPACE_EGRESS_ALLOWLIST, attached by the runner
  # to every sandbox network as `proxy` (CD-022).
  proxy:
    image: ubuntu/squid:6.10-24.10_beta@sha256:c9f5212b147a766529c7b026e2bebed37b998d33d0066b658596af5eba7cc65c
    entrypoint: ["/bin/bash", "/etc/dh-proxy/entrypoint.sh"]
    environment:
      WORKSPACE_EGRESS_ALLOWLIST: ${WORKSPACE_EGRESS_ALLOWLIST:-}
    volumes: ["./docker/proxy:/etc/dh-proxy:ro"]
    networks: [egress]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Workspace images, built only on demand: `docker compose --profile images build`.
  workspace-python:
    image: ${DH_IMAGE_PREFIX:-ghcr.io/francescoridolfi}/dexterhouse-workspace:python
    build: { context: ., dockerfile: docker/Dockerfile.workspace-python }
    profiles: [images]
  workspace-node:
    image: ${DH_IMAGE_PREFIX:-ghcr.io/francescoridolfi}/dexterhouse-workspace:node
    build: { context: ., dockerfile: docker/Dockerfile.workspace-node }
    profiles: [images]
  workspace-full:
    image: ${DH_IMAGE_PREFIX:-ghcr.io/francescoridolfi}/dexterhouse-workspace:full
    build: { context: ., dockerfile: docker/Dockerfile.workspace-full }
    profiles: [images]

  frontend:
    image: ${DH_IMAGE_PREFIX:-ghcr.io/francescoridolfi}/dexterhouse-frontend:${DH_VERSION:-0.1.0}
    build: { context: ., dockerfile: docker/Dockerfile.frontend }
    ports: ["${HTTP_PORT:-80}:80"]
    networks: [public]
    depends_on: [web]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_DB: dexterhouse
      POSTGRES_USER: dexterhouse
      POSTGRES_PASSWORD_FILE: /run/dh-secrets/pg_password
    volumes: [pgdata:/var/lib/postgresql/data, dh_secrets:/run/dh-secrets:ro]
    depends_on:
      secrets-init: { condition: service_completed_successfully }
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dexterhouse -d dexterhouse"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.10-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped

networks:
  public: {}
  internal: { internal: true }
  egress: {}

volumes:
  pgdata: {}
  redisdata: {}
  packages: {}
  dh_secrets: {}
