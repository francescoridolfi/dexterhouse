# Production overlay (docs/install.md): TLS with Caddy, log rotation, read-only core containers.
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# Needs CADDY_DOMAIN (DNS pointing here, ports 80 and 443 reachable) in .env.
x-logging: &logging
  driver: json-file
  options: { max-size: 50m, max-file: "5" }

x-read-only: &read-only
  read_only: true
  tmpfs: [/tmp]
  logging: *logging

services:
  caddy:
    image: caddy:2.11-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?set CADDY_DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public]
    depends_on: [frontend]
    logging: *logging
    restart: unless-stopped

  # Only Caddy is published; the frontend is reached through it.
  frontend:
    ports: !reset []
    logging: *logging

  web:
    <<: *read-only
    environment:
      DH_SERVICE: web
      API_TRUSTED_PROXIES: "2" # Caddy, then nginx
  worker: *read-only
  beat: *read-only
  runner:
    logging: *logging
  proxy:
    logging: *logging
  postgres:
    logging: *logging
  redis:
    logging: *logging

volumes:
  caddy_data: {}
  caddy_config: {}
