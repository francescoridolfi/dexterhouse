# Development overrides, loaded automatically by `docker compose up`.
# Exposes Postgres and Redis on localhost so `uv run manage.py ...` and `uv run pytest` work.
services:
  postgres:
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    networks: [internal, public]
  redis:
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    networks: [internal, public]
  # Mailpit catches the gate notification emails (E-06): UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.32
    ports: ["127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"]
    networks: [internal, public]
    restart: unless-stopped
  web:
    environment: &dev-mail
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      NOTIFICATIONS_EMAIL: "true"
  worker:
    environment: *dev-mail
