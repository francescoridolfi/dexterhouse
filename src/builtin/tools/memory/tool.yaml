# Built-in tools served by the combined per-turn process `dexterhouse.apps.agents.builtin_mcp`
# (one stdio process per turn shared by memory, project and skills). `memory.*` searches the project memory; the project comes from the interpolations.
schema: 1
name: memory
transport: stdio
runs_in: worker
command: ["python", "-m", "dexterhouse.apps.agents.builtin_mcp"]
env:
  DH_PROJECT_ID: "${project.id}"
  DH_ORGANIZATION_ID: "${project.organization_id}"
  DH_TURN_ID: "${project.turn_id}"
  DH_DATA_RESIDENCY: "${project.data_residency}"
permissions:
  - id: memory.search
    mcp_tool: memory_search
    description: "Search the project memory (artifacts, gate comments, retrospective lessons) by relevance; returns the best chunks with their artifact and score."
    risk: low
  - id: memory.recent
    mcp_tool: memory_recent
    description: "List the most recently indexed artifacts, gate comments and notes of the project."
    risk: low
network: allowlist
hosts: [postgres, ollama]
healthcheck: { timeout_s: 20 }
