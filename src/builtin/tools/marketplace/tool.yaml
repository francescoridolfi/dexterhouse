# Built-in tools served by the combined per-turn process `dexterhouse.apps.agents.builtin_mcp`
# (one stdio process per turn shared by the built-in worker tools). `marketplace.*` reads the
# registry index (REGISTRY_INDEX_URL) and the package files at their tag (MARKETPLACE_RAW_URL,
# raw.githubusercontent.com by default); texts come back wrapped as untrusted.
schema: 1
name: marketplace
transport: stdio
runs_in: worker
command: ["python", "-m", "dexterhouse.apps.agents.builtin_mcp"]
env:
  DH_PROJECT_ID: "${project.id}"
  DH_ORGANIZATION_ID: "${project.organization_id}"
  DH_TURN_ID: "${project.turn_id}"
  DH_DATA_RESIDENCY: "${project.data_residency}"
permissions:
  - id: marketplace.search
    mcp_tool: marketplace_search
    description: "Search marketplace packages by words of name, tags and description (query, kind?, tags?, verified_only, limit); `source` says where the data came from: index, cache (registry unreachable, last good copy) or unreachable."
    risk: low
  - id: marketplace.details
    mcp_tool: marketplace_details
    description: "One marketplace package: README (untrusted), versions compatible with this core, role, room, skills, requested permissions with their risk, `flags` when the README addresses agents."
    risk: low
network: allowlist
hosts: [postgres, redis, raw.githubusercontent.com]   # plus the registry host of REGISTRY_INDEX_URL
healthcheck: { timeout_s: 20 }
