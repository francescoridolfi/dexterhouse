# Price table in USD per 1M tokens (CD-024). Values are placeholders to verify against the
# providers' price lists; override the whole file with PRICES_FILE and the rate with FX_EUR_PER_USD.
price_version: "2026-11-01"
currency: USD
fx:
  EUR_per_USD: 0.92
models:
  anthropic:
    # Anthropic list prices (checked 2026-11-01); cache writes at 1.25x input (5-minute TTL).
    claude-opus-5-5: { input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00 }
    claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50 }
    claude-haiku-5-5: { input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125 }
  openai:
    gpt-5: { input: 1.25, output: 10.00, cache_read: 0.125 }
  ollama:
    "*": { input: 0, output: 0 }
  openai-compatible:
    "*": { input: 0, output: 0, note: "configure per endpoint" }
  # Test provider: non-zero prices so cost accounting is exercised in CI.
  fake:
    fake-model: { input: 1.00, output: 2.00, cache_read: 0.10, cache_write: 1.25 }
embeddings:
  ollama: { "mxbai-embed-large": { input: 0 } }
  openai: { "text-embedding-3-small": { input: 0.02 } }
