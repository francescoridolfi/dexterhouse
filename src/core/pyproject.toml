[project]
name = "dexterhouse"
version = "0.1.0"
description = "DexterHouse core: Django API, workflow engine, agents runtime and LLM gateway."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Francesco Ridolfi" }]
dependencies = [
  "dexterhouse-schema",
  "django>=5.2,<6.0",
  "djangorestframework>=3.15",
  "channels>=4.2",
  "celery[redis]>=5.5,<6",
  "django-celery-beat>=2.7",
  "redis>=5.2",
  "psycopg[binary]>=3.2",
  "dj-database-url>=2.3",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "structlog>=24.4",
  "uvicorn[standard]>=0.32",
  "whitenoise>=6.8",
  "uuid6>=2024.7",
  "cryptography>=43",
  "anthropic>=2.3,<3",
  "openai>=3.40,<4",
  "mcp>=2.3,<3",
  "pgvector>=0.5",
  "pyjwt>=2.10",
  "httpx2>=2.16",
  "prometheus-client>=0.21",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "typer>=0.15",
]

[project.scripts]
dexterhouse-manage = "dexterhouse.manage:main"
dexterhouse-mcp-bridge = "dexterhouse.apps.gateway.bridge:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dexterhouse"]
