[project]
name = "dexterhouse-runner"
version = "0.1.0"
description = "DexterHouse runner: workspace sandboxes and MCP workspace tools (does not import core)."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Francesco Ridolfi" }]
dependencies = [
  "dexterhouse-schema",
  "celery[redis]>=5.5,<6",
  "redis>=5.2",
  "docker>=7.1",
  "mcp>=2.3,<3",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "detect-secrets>=1.5",
]

[project.scripts]
dexterhouse-runner = "dexterhouse_runner.cli:main"
dexterhouse-workspace-mcp = "dexterhouse_runner.workspace_mcp.server:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dexterhouse_runner"]
