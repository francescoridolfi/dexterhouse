[project]
name = "dexterhouse-workspace"
version = "0.1.0"
description = "An open-source software house run by AI agents."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Francesco Ridolfi" }]
dependencies = ["dexterhouse", "dexterhouse-schema", "dexterhouse-runner"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.112",
  "daphne>=4.2.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/core", "src/schema", "src/runner"]

[tool.uv.sources]
dexterhouse = { workspace = true }
dexterhouse-schema = { workspace = true }
dexterhouse-runner = { workspace = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dexterhouse.settings.test"
testpaths = ["src/core/tests", "src/schema/tests", "src/runner/tests"]
addopts = "-ra --strict-markers --durations=10 --durations-min=1.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: long-running tests (starts processes or runs a whole workflow); excluded from the fast CI job",
  "security: sandbox escape tests (T1-T9)",
]

[tool.coverage.run]
source = ["src/core/dexterhouse", "src/schema/dexterhouse_schema", "src/runner/dexterhouse_runner"]
omit = ["*/migrations/*", "*/settings/prod.py", "*/settings/dev.py", "*/dexterhouse/manage.py", "*/asgi.py", "*/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src/core", "src/runner", "src/schema"]
extend-exclude = ["src/frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "DJ", "PT", "RUF", "ASYNC", "T20"]
ignore = ["S101"] # assert in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
# The runner tests drive git and the workspace tools on temporary repositories.
"src/runner/tests/**" = ["S105", "S106", "S603", "S607"]
"**/migrations/**" = ["E501", "RUF012"]
# Django declares admin options and Meta attributes as mutable class attributes by design.
"**/admin.py" = ["RUF012"]
# The data model contracts use NULL for absent strings (rendered as JSON null by the API).
"**/models.py" = ["RUF012", "DJ001"]

[tool.bandit]
exclude_dirs = ["tests", "src/frontend"]
skips = []

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
update_changelog_on_bump = true
tag_format = "v$version"
