# Dependency updates (T9). Weekly, grouped so a week is one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      python: { patterns: ["*"] }
    # Django 6.1 is blocked by django-celery-beat (django<6.1): drop when it is supported.
    ignore:
      - dependency-name: django
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /src/frontend
    schedule: { interval: weekly, day: monday }
    # Minor/patch grouped; other majors arrive one per pull request, except
    # coupled majors (peer ranges) that must move together. First match wins.
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "@react-three/*"]
        update-types: [major]
      i18n:
        patterns: ["i18next", "react-i18next"]
        update-types: [major]
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    # TypeScript 7 is blocked by typescript-eslint 8 (typescript <6.1): drop when it is supported.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Tracks the Node runtime (.nvmrc, Dockerfile.frontend): bump together with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
  # Base images of docker/Dockerfile.* (pinned by digest: Dependabot refreshes the digest).
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly, day: monday }
    groups:
      images: { patterns: ["*"] }
  # Postgres, Redis and Squid pinned in compose.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
