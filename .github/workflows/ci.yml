name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: src/frontend
      - name: pre-commit run --all-files
        # no-commit-to-branch guards local commits; on a push to main it would always fail.
        env:
          SKIP: no-commit-to-branch
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dexterhouse
          POSTGRES_DB: dexterhouse
          # Throwaway CI database reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dexterhouse" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://dexterhouse@localhost:5432/dexterhouse
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run manage.py makemigrations --check --dry-run
      - name: Fast suite (unit and integration, no process-spawning tests)
        # Budget: under 3 minutes here, under 60 s locally (06_engineering/testing.md).
        run: uv run pytest -m "not slow and not security" --cov --cov-report=term-missing --cov-report=xml

  test-slow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Three groups of similar duration run in parallel; each is a separate runner.
        group:
          - name: brief-samples
            args: src/core/tests/brief_samples
          - name: e2e-builtin
            args: src/core/tests/workflows/test_e2e_builtin.py
          - name: runtime
            args: >-
              --ignore=src/core/tests/brief_samples --ignore=src/core/tests/workflows/test_e2e_builtin.py
              --ignore=src/core/tests/workflows/test_e2e_runner.py
              --ignore=src/core/tests/workspaces/test_runner_worker.py
          # The real runner: Docker, the workspace image, the egress proxy (E-05).
          - name: runner
            args: src/core/tests/workflows/test_e2e_runner.py src/core/tests/workspaces/test_runner_worker.py
            docker: true
    name: test-slow (${{ matrix.group.name }})
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dexterhouse
          POSTGRES_DB: dexterhouse
          # Throwaway CI database reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dexterhouse" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://dexterhouse@localhost:5432/dexterhouse
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - uses: docker/setup-buildx-action@v4
        if: matrix.group.docker
      - name: Build the workspace image
        if: matrix.group.docker
        run: docker buildx build --load -f docker/Dockerfile.workspace-python -t ghcr.io/francescoridolfi/dexterhouse-workspace:python .
      - name: Slow suite (real Celery worker, end-to-end runs with MCP server processes)
        run: uv run pytest -m "slow and not security" --no-cov ${{ matrix.group.args }}

  security:
    # T1-T9 (infra/security_tests.md) against real workspaces: Docker, the egress proxy, the
    # internal secrets endpoint. Required for every release (definition of done).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dexterhouse
          POSTGRES_DB: dexterhouse
          # Throwaway CI database reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dexterhouse" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://dexterhouse@localhost:5432/dexterhouse
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - uses: docker/setup-buildx-action@v4
      - name: Build the workspace image
        run: docker buildx build --load -f docker/Dockerfile.workspace-python -t ghcr.io/francescoridolfi/dexterhouse-workspace:python .
      - name: Security suite
        run: uv run pytest -m security --no-cov -v --junitxml=reports/security.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-report
          path: reports/security.xml
      - name: Leftover test containers
        if: always()
        run: docker ps -a --filter name=dh-test --format '{{.Names}} {{.Status}}'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [test, test-slow, security, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build images
        run: |
          cp .env.example .env
          # The e2e smoke runs the built-in agents on the `fake` provider (no LLM).
          sed -i 's#^GATEWAY_FAKE_RESPONDER=.*#GATEWAY_FAKE_RESPONDER=dexterhouse.apps.agents.demo.respond#' .env
          docker compose -f compose.yaml build
      - name: Smoke test the stack
        run: |
          docker compose -f compose.yaml up -d --wait --wait-timeout 180
          docker compose -f compose.yaml ps
          curl -fsS http://localhost/health/ready
      - name: Create the first owner (e2e)
        env:
          DH_OWNER_PASSWORD: ci-e2e-owner-password  # pragma: allowlist secret (throwaway CI stack)
        run: >-
          docker compose -f compose.yaml exec -T -e DH_OWNER_PASSWORD web
          dexterhouse-manage bootstrap_owner --username admin
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: E2E smoke (Playwright, real core)
        working-directory: src/frontend
        env:
          E2E_BASE_URL: http://localhost
          E2E_PASSWORD: ci-e2e-owner-password  # pragma: allowlist secret
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Metrics and health of every service
        run: |
          docker compose -f compose.yaml exec -T web curl -fsS http://localhost:8000/metrics | grep dh_projects
          test -z "$(docker compose -f compose.yaml ps --format '{{.Service}} {{.Health}}' | grep -v healthy | grep -v '^\(secrets-init\|migrate\) ')"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: src/frontend/playwright-report
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml down -v
