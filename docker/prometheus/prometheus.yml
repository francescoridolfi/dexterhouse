# Scrape config of the optional `monitoring` profile (compose.prod.yaml, docs/operations.md).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: dexterhouse-core
    metrics_path: /metrics
    static_configs: [{ targets: ["web:8000"] }]
  - job_name: dexterhouse-runner
    static_configs: [{ targets: ["runner:9100"] }]
